{% extends 'mailings/base.html' %}
{% block title %}Сообщения{% endblock %}
{% block content %}
    <h1>Сообщения</h1>
    <a href="{% url 'mailings:message_create' %}">Добавить сообщение</a>
    <ul>
        {% for m in messages %}
            <li>{{ m.subject }}
                (<a href="{% url 'mailings:message_update' m.pk %}">ред.</a>
                 <a href="{% url 'mailings:message_delete' m.pk %}">удал.</a>)
            </li>
        {% empty %}
            <li>Пока нет сообщений.</li>
        {% endfor %}
    </ul>
{% endblock %}
