{% extends 'mailings/base.html' %}
{% block title %}Удалить рассылку{% endblock %}
{% block content %}
    <h1>Удалить рассылку?</h1>
    <p>Вы уверены, что хотите удалить рассылку от {{ object.start_time }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Удалить</button>
        <a href="{% url 'mailings:mailing_list' %}">Отмена</a>
    </form>
{% endblock %}
