<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Сервис рассылок{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{% url 'mailings:home' %}">Главная</a> |
        <a href="{% url 'mailings:recipient_list' %}">Получатели</a> |
        <a href="{% url 'mailings:message_list' %}">Сообщения</a> |
        <a href="{% url 'mailings:mailing_list' %}">Рассылки</a> |
        {% if user.is_authenticated %}
            <span>Привет, {{ user.username }}!</span>
            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit">Выйти</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Войти</a>
        {% endif %}
        {% if not user.is_authenticated %}
            <a href="{% url 'mailings:register' %}">Регистрация</a> |
            <a href="{% url 'login' %}">Войти</a>
        {% endif %}
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
